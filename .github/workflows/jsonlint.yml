---
name: "JSON Lint"

on:  # yamllint disable-line rule:truthy
  # Makes it reusable; called by other workflows
  workflow_call:  # yamllint disable rule:empty-values

permissions:
  contents: "read"

jobs:
  lint:
    name: "JSON Lint"
    runs-on: "ubuntu-latest"
    # Adding 'timeout-minutes: 10' would prevent jobs from running
    # indefinitely if something goes wrong
    timeout-minutes: 10
    steps:

      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"  # v7.0.0
        with:
          python-version: "3.x"

      # No pip install: workspace/json_lint.py uses only the standard
      # library, so there is nothing to cache and no third-party action
      # to pin.
      - name: "Lint JSON Files"
        # Lints every tracked *.json except .godot/, addons/ and contrib/
        # (see EXCLUDED_PREFIXES in json_lint.py). Problems are printed as
        # ::error annotations, so they show inline on the PR diff.
        run: |
          python -I workspace/json_lint.py
